name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - packages/worker/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy.yml
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:worker

  deploy:
    name: Deploy to Cloudflare
    needs: [test]
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://leaderborder.xaverric.cz
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip without Cloudflare secrets
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the production environment, see docs/RELEASING.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: 22
          package-manager-cache: false
      - if: env.HAS_CLOUDFLARE == 'true'
        run: npm ci
      - name: Migrate D1 and deploy
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/worker
          command: |
            d1 migrations apply leaderborder --remote
            deploy --var GIT_SHA:${{ github.sha }}
