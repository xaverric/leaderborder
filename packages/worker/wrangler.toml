name = "leaderborder"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*", "/app", "/app/*"]

[[d1_databases]]
binding = "DB"
database_name = "leaderborder"
database_id = "0409dfb7-8b69-41fb-934b-0e5e4f902d04"
migrations_dir = "migrations"

[[ratelimits]]
name = "USAGE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[vars]
APP_URL = "https://leaderborder.xaverric.cz"
GITHUB_CLIENT_ID = "Ov23liGpxnsqRCLTD8Pr"
ALLOWED_GITHUB_ORGS = ""
ALLOWED_GITHUB_LOGINS = ""
LEADERBOARD_TZ = "Europe/Prague"
