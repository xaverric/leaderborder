name = "leaderborder"
main = "src/index.js"
compatibility_date = "2026-09-01"
routes = [{ pattern = "leaderborder.xaverric.cz", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*", "/app", "/app/*"]

[[d1_databases]]
binding = "DB"
database_name = "leaderborder"
database_id = "0409dfb7-8b69-41fb-934b-0e5e4f902d04"
migrations_dir = "migrations"

[[ratelimits]]
name = "USAGE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[observability]
enabled = true

[vars]
APP_URL = "https://leaderborder.xaverric.cz"
GITHUB_CLIENT_ID = "Ov23liGpxnsqRCLTD8Pr"
LEADERBOARD_TZ = "Europe/Prague"
